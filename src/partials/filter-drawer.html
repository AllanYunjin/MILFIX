    <!-- GAVETA 2: FILTROS TÉCNICOS (CELULAR) -->
    <div id="filterDrawerOverlay" onclick="toggleFilterDrawer(false)" class="fixed inset-0 bg-navy-950/70 backdrop-blur-xs z-50 hidden"></div>
    <div id="filterDrawer" class="fixed top-0 right-0 bottom-0 w-80 max-w-[90vw] bg-white z-50 transform translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
        <div class="p-4 bg-navy-900 text-white flex items-center justify-between">
            <h3 class="font-bold flex items-center gap-2">
                <i class="fa-solid fa-sliders text-industrial-amber"></i>
                <span>Filtrar Catálogo</span>
            </h3>
            <button onclick="toggleFilterDrawer(false)" class="p-2 rounded-lg bg-navy-800 text-slate-300 hover:text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <!-- Sincronizado automaticamente com os filtros do desktop -->
        <div id="mobileFiltersContainer" class="p-5 flex-1 overflow-y-auto space-y-6"></div>
        <div class="p-4 border-t border-slate-200 bg-slate-50 flex items-center gap-3">
            <button onclick="resetAllFilters()" class="flex-1 py-2.5 px-4 rounded-lg border border-slate-300 text-slate-700 font-semibold text-sm">
                Limpar
            </button>
            <button onclick="toggleFilterDrawer(false)" class="flex-1 py-2.5 px-4 rounded-lg bg-industrial-amber text-navy-950 font-extrabold text-sm shadow">
                Ver Resultados
            </button>
        </div>
    </div>
