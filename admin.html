<!-- ARQUIVO: admin.html | Atualizado em 15/11/2026 | Painel administrativo. Lógica em assets/js/admin.js -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>MILFIX | Painel Administrativo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<!-- config.js = chaves do Supabase (as mesmas do site) -->
<script src="assets/js/config.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

<!-- LOGIN -->
<div id="loginBox" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow p-6 w-full max-w-sm space-y-3">
    <h1 class="text-xl font-bold text-[#0F233C]">MILFIX · Painel</h1>
    <input id="email" type="email" placeholder="E-mail" class="w-full border rounded-lg px-3 py-2 text-sm">
    <input id="pass" type="password" placeholder="Senha" class="w-full border rounded-lg px-3 py-2 text-sm" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()" class="w-full bg-[#0F233C] text-white font-semibold rounded-lg py-2.5 text-sm">Entrar</button>
    <p id="loginErr" class="text-red-600 text-xs"></p>
  </div>
</div>

<!-- PAINEL -->
<div id="app" class="hidden max-w-6xl mx-auto p-4">
  <header class="flex items-center justify-between mb-4">
    <h1 class="text-xl font-bold text-[#0F233C]">MILFIX · Painel</h1>
    <button onclick="logout()" class="text-sm text-slate-500 hover:text-red-600">Sair</button>
  </header>
  <div class="flex gap-2 mb-4">
    <button id="tabP" onclick="tab('p')" class="px-4 py-2 rounded-lg text-sm font-semibold">Produtos</button>
    <button id="tabQ" onclick="tab('q')" class="px-4 py-2 rounded-lg text-sm font-semibold">Orçamentos / Leads</button>
  </div>

  <!-- Produtos -->
  <section id="secP">
    <div class="flex flex-wrap gap-2 mb-3">
      <input id="pSearch" oninput="renderProducts()" placeholder="Buscar por SKU ou nome..." class="border rounded-lg px-3 py-2 text-sm flex-1 min-w-[200px]">
      <button onclick="openForm()" class="bg-amber-500 hover:bg-amber-600 text-[#091526] font-bold rounded-lg px-4 py-2 text-sm">+ Novo produto</button>
    </div>
    <div class="bg-white rounded-xl shadow overflow-x-auto">
      <table class="w-full text-sm"><thead class="bg-slate-50 text-left text-xs uppercase text-slate-500">
        <tr><th class="p-3">SKU</th><th class="p-3">Produto</th><th class="p-3">Categoria</th><th class="p-3">Ativo</th><th class="p-3"></th></tr></thead>
        <tbody id="pBody"></tbody></table>
    </div>
  </section>

  <!-- Orçamentos -->
  <section id="secQ" class="hidden">
    <div class="flex flex-wrap gap-2 mb-3">
      <input id="qSearch" oninput="renderQuotes()" placeholder="Buscar por nome, CPF/CNPJ, telefone..." class="border rounded-lg px-3 py-2 text-sm flex-1 min-w-[200px]">
      <button onclick="exportCSV()" class="bg-[#0F233C] text-white font-semibold rounded-lg px-4 py-2 text-sm">Exportar CSV</button>
    </div>
    <div id="qList" class="space-y-3"></div>
  </section>
</div>

<!-- Modal produto -->
<div id="modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl w-full max-w-xl max-h-[92vh] overflow-y-auto p-5 space-y-2">
    <h2 id="mTitle" class="font-bold text-lg text-[#0F233C]">Produto</h2>
    <input type="hidden" id="f_id">
    <div class="grid grid-cols-2 gap-2">
      <input id="f_sku" placeholder="SKU * (ex: MFX-1300)" class="border rounded-lg px-3 py-2 text-sm">
      <input id="f_category" list="cats" placeholder="Categoria *" class="border rounded-lg px-3 py-2 text-sm"><datalist id="cats"></datalist>
    </div>
    <input id="f_name" placeholder="Nome do produto *" class="w-full border rounded-lg px-3 py-2 text-sm">
    <div class="grid grid-cols-2 gap-2">
      <input id="f_material" placeholder="Material / Acabamento" class="border rounded-lg px-3 py-2 text-sm">
      <input id="f_application" placeholder="Aplicação" class="border rounded-lg px-3 py-2 text-sm">
      <input id="f_norm" placeholder="Norma (ex: DIN 933)" class="border rounded-lg px-3 py-2 text-sm">
      <input id="f_gauge" placeholder="Medida / Bitola" class="border rounded-lg px-3 py-2 text-sm">
    </div>
    <input id="f_packaging" placeholder="Embalagem (ex: Caixa com 100 unidades)" class="w-full border rounded-lg px-3 py-2 text-sm">
    <textarea id="f_description" rows="3" placeholder="Descrição técnica" class="w-full border rounded-lg px-3 py-2 text-sm"></textarea>
    <!-- FOTO DO PRODUTO: envia para o Supabase Storage e guarda o endereço em f_image -->
    <div class="border rounded-lg p-3 flex items-center gap-3">
      <div id="f_preview" class="w-20 h-20 shrink-0 rounded-lg bg-slate-100 border flex items-center justify-center text-[10px] text-slate-400 overflow-hidden">sem foto</div>
      <div class="text-xs space-y-1.5">
        <input type="hidden" id="f_image">
        <input type="file" id="f_file" accept="image/*" onchange="onPickImage(this)" class="text-xs">
        <button type="button" onclick="clearImage()" class="text-red-600">Remover foto</button>
        <p id="f_imgStatus" class="text-slate-500">JPG, PNG ou WebP. É reduzida automaticamente.</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <select id="f_svg" class="border rounded-lg px-3 py-2 text-sm">
        <option value="bolt">Parafuso</option><option value="rod">Barra roscada</option><option value="nut">Porca</option>
        <option value="anchor">Chumbador</option><option value="disc">Disco</option><option value="weld">Solda</option>
        <option value="epi">EPI</option><option value="wrench">Chave</option></select>
      <label class="text-sm flex items-center gap-1"><input type="checkbox" id="f_active" checked> Visível no site</label>
    </div>
    <p id="mErr" class="text-red-600 text-xs"></p>
    <div class="flex justify-end gap-2 pt-2">
      <button onclick="closeForm()" class="px-4 py-2 text-sm rounded-lg border">Cancelar</button>
      <button onclick="saveProduct()" class="px-4 py-2 text-sm rounded-lg bg-[#0F233C] text-white font-semibold">Salvar</button>
    </div>
  </div>
</div>

<script src="assets/js/admin.js"></script>
</body>
</html>
